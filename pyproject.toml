[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bmc-edit"
version = "1.0.0"
description = "Local Business Model Canvas editor with AI coaching — zero dependencies"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Jean Haiz" }]
keywords = ["business-model-canvas", "bmc", "startup", "strategy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Office/Business",
]

[project.scripts]
bmc-edit = "bmc_edit.server:main"

[project.urls]
Homepage = "https://github.com/JeanHaiz/bmc-edit"
Repository = "https://github.com/JeanHaiz/bmc-edit"

[tool.hatch.build.targets.wheel]
packages = ["bmc_edit"]

[tool.hatch.build.targets.wheel.force-include]
"bmc_edit/index.html" = "bmc_edit/index.html"
